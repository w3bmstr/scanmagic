      if (typeof Tesseract === "undefined") {
        toast("OCR library still loading – try again");
        return;
      }
      $("ocrPanel").classList.add("visible");
      $("ocrText").textContent = "Recognizing text…";
      showLoading(true);
      $("loadingMsg").textContent = "OCR running…";
      try {
        const dataUrl = canvas.toDataURL("image/png");
        const result = await Tesseract.recognize(dataUrl, "eng", {
          logger: m => {
            if (m.status === "recognizing text" && m.progress) {
              $("ocrText").textContent = `Recognizing… ${Math.round(m.progress * 100)}%`;
            }
          }
        });
        const text = (result.data && result.data.text || "").trim();
        $("ocrText").textContent = text || "(No text found)";
        if (state.scanMode === "card" && text) {
          toast("Business card text extracted");
        }
      } catch (err) {
        console.error(err);
        $("ocrText").textContent = "OCR failed. Check connection (first run downloads language data).";
        toast("OCR failed");
      } finally {
        showLoading(false);
        $("loadingMsg").textContent = "Processing…";
      }
    }

    $("btnCloseOcr").addEventListener("click", () => {
      $("ocrPanel").classList.remove("visible");
    });
    $("btnCopyOcr").addEventListener("click", async () => {
      const t = $("ocrText").textContent;
      try {
        await navigator.clipboard.writeText(t);
        toast("Copied to clipboard");
      } catch {
        toast("Could not copy");
      }
    });

    // ========== Export ==========
    function saveImage() {
      // default: JPEG of current page
      exportJpeg();
    }

    function exportJpeg() {
      if (!canvas.width) return;
      // if multipage, export all as separate files is awkward — export current
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `scan-${state.scanMode}-${Date.now()}.jpg`;
        a.click();
        URL.revokeObjectURL(url);
        toast("JPEG saved");
      }, "image/jpeg", state.exportQuality);
    }

    async function exportPdf() {
      const api = window.jspdf;
      if (!api || !api.jsPDF) {
        toast("PDF library loading – try again in a moment");
        return;
      }
      const { jsPDF } = api;

      let pages = state.pages.slice();
      if (!pages.length) {
        if (!canvas.width) {
          toast("Nothing to export");
          return;
        }
        pages = [{
          dataUrl: getCurrentDataUrl(state.exportQuality),
          width: canvas.width,
          height: canvas.height
        }];
      }

      showLoading(true);
      $("loadingMsg").textContent = "Building PDF…";
      try {
        let pdf = null;
        for (let i = 0; i < pages.length; i++) {
          const p = pages[i];
          const w = p.width;
          const h = p.height;
          const orient = w >= h ? "l" : "p";
          if (i === 0) {
            pdf = new jsPDF({ orientation: orient, unit: "mm", format: "a4" });
          } else {
            pdf.addPage("a4", orient);
          }
          const pageW = pdf.internal.pageSize.getWidth();
          const pageH = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const maxW = pageW - margin * 2;
          const maxH = pageH - margin * 2;
          let pw = maxW;
          let ph = maxW * (h / w);
          if (ph > maxH) {
            ph = maxH;
            pw = maxH * (w / h);
          }
          const x = (pageW - pw) / 2;
          const y = (pageH - ph) / 2;
          pdf.addImage(p.dataUrl, "JPEG", x, y, pw, ph);
        }
        pdf.save(`scan-${state.scanMode}-${Date.now()}.pdf`);
        toast(`PDF saved (${pages.length} page${pages.length > 1 ? "s" : ""})`);
      } catch (err) {
        console.error(err);
        toast("PDF export failed");
      } finally {
        showLoading(false);
        $("loadingMsg").textContent = "Processing…";
      }
    }

    $("btnExportJpg").addEventListener("click", exportJpeg);
    $("btnExportPdf").addEventListener("click", exportPdf);

    // Apply mode presets when opening editor
    function applyModePreset() {
      if (state.scanMode === "whiteboard") {
        setFilter("whiteboard");
      } else if (state.scanMode === "receipt" || state.scanMode === "card") {
        setFilter("enhance");
      }
    }

    // ========== Open editor ==========
    function openEditor() {
      showScreen("editor");
      setTool("move");
      applyModePreset();
      if (!state.filter) setFilter("original");
      else setFilter(state.filter);
      refreshPagesBar();
    }

    // Prevent pull-to-refresh / accidental zoom on iOS
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.body.addEventListener("touchmove", (e) => {
      if (e.target.closest(".tool-row, .filter-panel, .annotate-panel, .export-panel, #ocrPanel")) return;
    }, { passive: false });
  </script>
</body>
</html>
