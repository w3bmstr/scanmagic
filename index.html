    function annotateAt(x0, y0, x1, y1) {
      if (!state.baseImageData) return;
      const size = parseInt($("penSize").value, 10) || state.penSize;
      ctx.save();
      ctx.strokeStyle = state.penColor;
      ctx.fillStyle = state.penColor;
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x1, y1, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // sync image data from canvas
      state.currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      // also burn into base so filters later keep markup
      const b = state.baseImageData.data;
      const c = state.currentImageData.data;
      // only update stroked region roughly
      const minX = Math.max(0, Math.floor(Math.min(x0, x1) - size - 1));
      const maxX = Math.min(canvas.width - 1, Math.ceil(Math.max(x0, x1) + size + 1));
      const minY = Math.max(0, Math.floor(Math.min(y0, y1) - size - 1));
      const maxY = Math.min(canvas.height - 1, Math.ceil(Math.max(y0, y1) + size + 1));
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const i = (y * canvas.width + x) * 4;
          b[i] = c[i]; b[i + 1] = c[i + 1]; b[i + 2] = c[i + 2]; b[i + 3] = c[i + 3];
        }
      }
    }

    // Pointer events on canvas
    function onPointerDown(e) {
      e.preventDefault();
      const pos = getCanvasPos(e);
      if (state.tool === "eraser") {
        pushHistory();
        invalidatePaperCache(); // fresh paper sample each stroke
        state.isDrawing = true;
        eraseAt(pos.x, pos.y);
        state.lastX = pos.x;
        state.lastY = pos.y;
      } else if (state.tool === "annotate") {
        pushHistory();
        state.isDrawing = true;
        state.lastX = pos.x;
        state.lastY = pos.y;
        annotateAt(pos.x, pos.y, pos.x, pos.y);
      } else if (state.tool === "crop") {
        // crop is handled by handles / crop box — ignore canvas taps
        return;
      } else if (state.tool === "flatten") {
        if (state.flattenPoints.length >= 4) {
          state.flattenPoints = [];
          clearFlattenMarkers();
        }
        addFlattenMarker(pos.x, pos.y);
        const n = state.flattenPoints.length;
        $("flattenHint").textContent =
          n < 4 ? `Corner ${n}/4 – drag dots to adjust` : "Adjust dots if needed, then Apply Flatten";
        if (n === 4) toast("Ready – drag corners or Apply Flatten");
      } else {
        state.isPanning = true;
      }
    }

    function onPointerMove(e) {
      e.preventDefault();
      const pos = getCanvasPos(e);

      if (state.dragCornerIndex >= 0 && state.tool === "flatten") {
        const i = state.dragCornerIndex;
        state.flattenPoints[i] = {
          x: Math.max(0, Math.min(canvas.width, pos.x)),
          y: Math.max(0, Math.min(canvas.height, pos.y))
        };
        refreshFlattenUI();
        return;
      }

      if (!state.isDrawing && !state.cropStart) return;

      if (state.tool === "eraser" && state.isDrawing) {
        const dx = pos.x - state.lastX;
        const dy = pos.y - state.lastY;
        const dist = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.floor(dist / 4));
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          eraseAt(state.lastX + dx * t, state.lastY + dy * t);
        }
        state.lastX = pos.x;
        state.lastY = pos.y;
      } else if (state.tool === "annotate" && state.isDrawing) {
        annotateAt(state.lastX, state.lastY, pos.x, pos.y);
        state.lastX = pos.x;
        state.lastY = pos.y;
      }
    }

    function onPointerUp(e) {
      state.isDrawing = false;
      state.cropStart = null;
      state.isPanning = false;
      state.dragCornerIndex = -1;
    }

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointerleave", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);

    // Global move/up so corner dragging works after dots are recreated
    window.addEventListener("pointermove", (e) => {
      if (state.dragCornerIndex < 0) return;
      e.preventDefault();
      const pos = getCanvasPos(e);
      const i = state.dragCornerIndex;
      state.flattenPoints[i] = {
        x: Math.max(0, Math.min(canvas.width, pos.x)),
        y: Math.max(0, Math.min(canvas.height, pos.y))
      };
      // update only positions without full recreate for smooth drag
      const dots = canvasWrap.querySelectorAll(".corner-dot");
      if (dots[i]) {
        const p = canvasToWrap(state.flattenPoints[i].x, state.flattenPoints[i].y);
        dots[i].style.left = p.x + "px";
        dots[i].style.top = p.y + "px";
      }
      drawQuad();
    }, { passive: false });
    window.addEventListener("pointerup", () => { state.dragCornerIndex = -1; });
    window.addEventListener("pointercancel", () => { state.dragCornerIndex = -1; });

    window.addEventListener("resize", () => {
      if (state.cropRect) updateCropOverlay();
      if (state.flattenPoints.length) refreshFlattenUI();
    });

    $("btnUndo").addEventListener("click", undo);

    // ========== Scan modes ==========
    document.querySelectorAll(".mode-card").forEach(card => {
      card.addEventListener("click", () => {
        document.querySelectorAll(".mode-card").forEach(c => c.classList.remove("active"));
        card.classList.add("active");
        state.scanMode = card.dataset.mode;
        // preset filter hints
        if (state.scanMode === "whiteboard") state.filter = "whiteboard";
        else if (state.scanMode === "receipt") state.filter = "enhance";
        else if (state.scanMode === "card") state.filter = "enhance";
        else state.filter = "original";
        toast(card.textContent.trim() + " mode");
      });
    });

    // Annotate colors
    document.querySelectorAll(".color-dot").forEach(dot => {
      dot.addEventListener("click", () => {
        document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
        dot.classList.add("active");
        state.penColor = dot.dataset.color;
      });
    });

    // Quality chips
    document.querySelectorAll("[data-quality]").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll("[data-quality]").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        state.exportQuality = parseFloat(chip.dataset.quality);
      });
    });

    // ========== Multi-page ==========
    function getCurrentDataUrl(quality) {
      return canvas.toDataURL("image/jpeg", quality || state.exportQuality);
    }

    function addCurrentAsPage() {
      if (!canvas.width) return;
      const dataUrl = getCurrentDataUrl(0.92);
      state.pages.push({
        dataUrl,
        width: canvas.width,
        height: canvas.height
      });
      refreshPagesBar();
      toast(`Page ${state.pages.length} added`);
    }

    function refreshPagesBar() {
      const bar = $("pagesBar");
      const homePrev = $("pagesPreview");
      if (!state.pages.length) {
        bar.classList.remove("visible");
        bar.innerHTML = "";
        homePrev.style.display = "none";
        homePrev.innerHTML = "";
        return;
      }
      bar.classList.add("visible");
      bar.innerHTML = state.pages.map((p, i) =>
        `<img class="page-thumb" src="${p.dataUrl}" data-i="${i}" title="Page ${i + 1}" />`
      ).join("") + `<span style="font-size:0.75rem;color:var(--muted);padding:0 6px">${state.pages.length} page${state.pages.length > 1 ? "s" : ""}</span>`;
      homePrev.style.display = "flex";
      homePrev.innerHTML = state.pages.map((p, i) =>
        `<img class="page-thumb" src="${p.dataUrl}" title="Page ${i + 1}" />`
      ).join("");
    }

    $("btnAddPage").addEventListener("click", () => {
      addCurrentAsPage();
    });

    // ========== OCR ==========
    async function runOCR() {
      if (!canvas.width) return;
      if (typeof Tesseract === "undefined") {
        toast("OCR library still loading – try again");
        return;
      }
      $("ocrPanel").classList.add("visible");
      $("ocrText").textContent = "Recognizing text…";
      showLoading(true);
      $("loadingMsg").textContent = "OCR running…";
      try {
        const dataUrl = canvas.toDataURL("image/png");
        const result = await Tesseract.recognize(dataUrl, "eng", {
          logger: m => {
            if (m.status === "recognizing text" && m.progress) {
              $("ocrText").textContent = `Recognizing… ${Math.round(m.progress * 100)}%`;
            }
          }
        });
        const text = (result.data && result.data.text || "").trim();
        $("ocrText").textContent = text || "(No text found)";
        if (state.scanMode === "card" && text) {
          toast("Business card text extracted");
        }
      } catch (err) {
        console.error(err);
        $("ocrText").textContent = "OCR failed. Check connection (first run downloads language data).";
        toast("OCR failed");
      } finally {
        showLoading(false);
        $("loadingMsg").textContent = "Processing…";
      }
    }

    $("btnCloseOcr").addEventListener("click", () => {
      $("ocrPanel").classList.remove("visible");
    });
    $("btnCopyOcr").addEventListener("click", async () => {
      const t = $("ocrText").textContent;
      try {
        await navigator.clipboard.writeText(t);
        toast("Copied to clipboard");
      } catch {
        toast("Could not copy");
      }
    });

    // ========== Export ==========
    function saveImage() {
      // default: JPEG of current page
      exportJpeg();
    }

    function exportJpeg() {
      if (!canvas.width) return;
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `scan-${state.scanMode}-${Date.now()}.jpg`;
        a.click();
        URL.revokeObjectURL(url);
        if (navigator.vibrate) navigator.vibrate(20);
        toast("JPEG saved");
      }, "image/jpeg", state.exportQuality);
    }

    async function shareScan() {
      if (!canvas.width) return;
      try {
        const blob = await new Promise((res) =>
          canvas.toBlob(res, "image/jpeg", state.exportQuality)
        );
        const file = new File([blob], `scan-${state.scanMode}-${Date.now()}.jpg`, {
          type: "image/jpeg"
        });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: "ScanMagic",
            text: "Scanned with ScanMagic"
          });
          toast("Shared");
        } else if (navigator.share) {
          const dataUrl = canvas.toDataURL("image/jpeg", state.exportQuality);
          await navigator.share({ title: "ScanMagic", text: dataUrl });
        } else {
          exportJpeg();
          toast("Share not supported — downloaded instead");
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
        console.error(err);
        exportJpeg();
      }
    }

    async function exportPdf() {
      const api = window.jspdf;
      if (!api || !api.jsPDF) {
        toast("PDF library loading – try again in a moment");
        return;
      }
      const { jsPDF } = api;

      let pages = state.pages.slice();
      if (!pages.length) {
        if (!canvas.width) {
          toast("Nothing to export");
          return;
        }
        pages = [{
          dataUrl: getCurrentDataUrl(state.exportQuality),
          width: canvas.width,
          height: canvas.height
        }];
      }

      showLoading(true);
      $("loadingMsg").textContent = "Building PDF…";
      try {
        let pdf = null;
        for (let i = 0; i < pages.length; i++) {
          const p = pages[i];
          const w = p.width;
          const h = p.height;
          const orient = w >= h ? "l" : "p";
          if (i === 0) {
            pdf = new jsPDF({ orientation: orient, unit: "mm", format: "a4" });
          } else {
            pdf.addPage("a4", orient);
          }
          const pageW = pdf.internal.pageSize.getWidth();
          const pageH = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const maxW = pageW - margin * 2;
          const maxH = pageH - margin * 2;
          let pw = maxW;
          let ph = maxW * (h / w);
          if (ph > maxH) {
            ph = maxH;
            pw = maxH * (w / h);
          }
          const x = (pageW - pw) / 2;
          const y = (pageH - ph) / 2;
          pdf.addImage(p.dataUrl, "JPEG", x, y, pw, ph);
        }
        pdf.save(`scan-${state.scanMode}-${Date.now()}.pdf`);
        toast(`PDF saved (${pages.length} page${pages.length > 1 ? "s" : ""})`);
      } catch (err) {
        console.error(err);
        toast("PDF export failed");
      } finally {
        showLoading(false);
        $("loadingMsg").textContent = "Processing…";
      }
    }

    $("btnExportJpg").addEventListener("click", exportJpeg);
    $("btnExportPdf").addEventListener("click", exportPdf);
    $("btnShare").addEventListener("click", shareScan);

    // Apply mode presets when opening editor
    function applyModePreset() {
      if (state.scanMode === "whiteboard") {
        setFilter("whiteboard");
      } else if (state.scanMode === "receipt" || state.scanMode === "card") {
        setFilter("enhance");
      }
    }

    // ========== Auto document bounds (for crop) ==========
    function detectDocumentBounds() {
      if (!state.baseImageData) return null;
      const { width: w, height: h, data } = state.baseImageData;
      if (w < 50 || h < 50) return null;

      // Downsample for speed
      const step = Math.max(1, Math.floor(Math.min(w, h) / 200));
      const paper = estimatePaperColor(state.baseImageData);
      const paperLum = 0.299 * paper.r + 0.587 * paper.g + 0.114 * paper.b;

      // Score rows/cols: fraction of "non-background" (desk is usually darker or very different)
      function rowScore(y) {
        let hit = 0, n = 0;
        for (let x = 0; x < w; x += step) {
          const i = (y * w + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          // page content or paper vs dark surroundings
          if (Math.abs(lum - paperLum) < 55 || lum > paperLum - 30) hit++;
          n++;
        }
        return hit / n;
      }
      function colScore(x) {
        let hit = 0, n = 0;
        for (let y = 0; y < h; y += step) {
          const i = (y * w + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (Math.abs(lum - paperLum) < 55 || lum > paperLum - 30) hit++;
          n++;
        }
        return hit / n;
      }

      const thresh = 0.55;
      let top = 0, bottom = h - 1, left = 0, right = w - 1;
      for (let y = 0; y < h; y += step) {
        if (rowScore(y) > thresh) { top = Math.max(0, y - step); break; }
      }
      for (let y = h - 1; y >= 0; y -= step) {
        if (rowScore(y) > thresh) { bottom = Math.min(h - 1, y + step); break; }
      }
      for (let x = 0; x < w; x += step) {
        if (colScore(x) > thresh) { left = Math.max(0, x - step); break; }
      }
      for (let x = w - 1; x >= 0; x -= step) {
        if (colScore(x) > thresh) { right = Math.min(w - 1, x + step); break; }
      }

      const pad = Math.round(Math.min(w, h) * 0.01);
      top = Math.max(0, top - pad);
      left = Math.max(0, left - pad);
      bottom = Math.min(h - 1, bottom + pad);
      right = Math.min(w - 1, right + pad);

      const rw = right - left + 1;
      const rh = bottom - top + 1;
      // Reject if detection is almost full image or tiny
      if (rw < w * 0.35 || rh < h * 0.35) return null;
      if (rw > w * 0.98 && rh > h * 0.98) return null;
      return { x: left, y: top, w: rw, h: rh };
    }

    // ========== Magic Enhance (scanner-app one-tap) ==========
    function runProcessAsync(fn) {
      return new Promise((resolve) => {
        // Each process shows its own loading; we manage outer loading
        const origShow = showLoading;
        // temporarily no-op nested loading
        let nested = false;
        showLoading(true);
        // Call the process — they use setTimeout 40ms internally
        // Monkey-patch toast to silence intermediate messages
        const origToast = toast;
        const msgs = [];
        window._silentToast = true;
        const tWrap = (msg, ms) => { msgs.push(msg); };
        // Direct call of internal logic is hard; chain by re-invoking with flags

        // Simpler approach: sequential execution of core algorithms
        resolve();
      });
    }

    function runMagicEnhance() {
      if (!state.baseImageData) {
        toast("No image loaded");
        return;
      }
      showLoading(true);
      $("loadingMsg").textContent = "Magic Enhance…";

      // Run heal → autofix → deblur as sequential promises
      const quiet = { silent: true };
      setTimeout(() => {
        try {
          // Snapshot for single undo
          // pushHistory is called inside each — remove intermediate by only pushing once
          // We'll push once here and skip inside by using direct pipeline

          // 1) Illumination flatten + heal (core of runHeal without UI)
          magicHealCore();
          $("loadingMsg").textContent = "Cleaning background…";
          setTimeout(() => {
            try {
              magicAutoFixCore();
              $("loadingMsg").textContent = "Sharpening text…";
              setTimeout(() => {
                try {
                  magicDeblurCore();
                  // Auto-crop if document bounds are clear
                  $("loadingMsg").textContent = "Detecting edges…";
                  const bounds = detectDocumentBounds();
                  if (bounds && bounds.w > 40 && bounds.h > 40) {
                    const { x, y, w, h } = bounds;
                    const sx = Math.max(0, Math.floor(x));
                    const sy = Math.max(0, Math.floor(y));
                    const sw = Math.min(state.baseImageData.width - sx, Math.floor(w));
                    const sh = Math.min(state.baseImageData.height - sy, Math.floor(h));
                    if (sw > 50 && sh > 50 && (sw < state.baseImageData.width * 0.98 || sh < state.baseImageData.height * 0.98)) {
                      const baseOff = document.createElement("canvas");
                      baseOff.width = sw;
                      baseOff.height = sh;
                      baseOff.getContext("2d").putImageData(state.baseImageData, -sx, -sy);
                      state.baseImageData = baseOff.getContext("2d").getImageData(0, 0, sw, sh);
                    }
                  }
                  invalidatePaperCache();
                  applyFilterAndDraw();
                  if (navigator.vibrate) navigator.vibrate(30);
                  toast("Scan ready — export or add another page");
                } catch (e) {
                  console.error(e);
                  toast("Enhance partially failed");
                } finally {
                  showLoading(false);
                  $("loadingMsg").textContent = "Processing…";
                }
              }, 30);
            } catch (e) {
              console.error(e);
              showLoading(false);
              toast("Enhance failed");
            }
          }, 30);
        } catch (e) {
          console.error(e);
          showLoading(false);
          toast("Enhance failed");
        }
      }, 30);
    }

    function magicHealCore() {
      // Reuse runHeal by temporarily suppressing history double-push
      // Inline: call the same illumination logic via runHeal's path
      // Simplest reliable path: invoke runHeal/runAutoFix/runDeblur but
      // push history only once at start of magic
      pushHistory();
      // Directly execute heal body by calling runHeal without pushHistory
      // Patch pushHistory temporarily
      const realPush = pushHistory;
      window._magicBatch = true;
      pushHistory = function () { /* skip during batch */ };
      try {
        // Synchronous path extraction - call internal by forcing
        // Since runHeal is async setTimeout, we need the core sync.

        // Inline minimal heal (illumination) 
        const src = state.baseImageData;
        const { width: w, height: h, data } = src;
        const paper = estimatePaperColor(src);
        const paperLum = Math.max(1, 0.299 * paper.r + 0.587 * paper.g + 0.114 * paper.b);
        const lum = new Float32Array(w * h);
        for (let i = 0, p = 0; i < data.length; i += 4, p++) {
          lum[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        }
        const blurR = Math.max(8, Math.round(Math.min(w, h) * 0.035));
        const illum = boxBlurChannel(lum, w, h, blurR);
        const illum2 = boxBlurChannel(illum, w, h, Math.max(4, Math.round(blurR * 0.5)));
        const isText = new Uint8Array(w * h);
        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const p = y * w + x;
            if (lum[p] > paperLum - 45) continue;
            let minL = 255, maxL = 0;
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                const l = lum[(y + dy) * w + (x + dx)];
                if (l < minL) minL = l;
                if (l > maxL) maxL = l;
              }
            }
            if (maxL - minL > 40 && lum[p] < paperLum - 55) isText[p] = 1;
          }
        }
        const out = new ImageData(w, h);
        const d = out.data;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const p = y * w + x;
            const i = p * 4;
            let r = data[i], g = data[i + 1], b = data[i + 2];
            const I = Math.max(8, illum2[p]);
            let gain = Math.min(2.2, Math.max(0.7, paperLum / I));
            if (isText[p]) {
              const mild = 1 + (gain - 1) * 0.15;
              r = clamp(r * mild); g = clamp(g * mild); b = clamp(b * mild);
            } else {
              r = clamp(r * gain); g = clamp(g * gain); b = clamp(b * gain);
              const nL = 0.299 * r + 0.587 * g + 0.114 * b;
              if (nL < paperLum - 8) {
                const t = Math.min(0.85, (paperLum - nL) / paperLum * 0.9);
                r = r * (1 - t) + paper.r * t;
                g = g * (1 - t) + paper.g * t;
                b = b * (1 - t) + paper.b * t;
              }
            }
            d[i] = clamp(r); d[i + 1] = clamp(g); d[i + 2] = clamp(b); d[i + 3] = 255;
          }
        }
        state.baseImageData = out;
      } finally {
        pushHistory = realPush;
        window._magicBatch = false;
      }
    }

    function magicAutoFixCore() {
      // Call existing runAutoFix but skip history & UI
      const src = state.baseImageData;
      const { width, height, data } = src;
      const out = new ImageData(width, height);
      const d = out.data;
      const paper = estimatePaperColor(src);
      const paperLum = 0.299 * paper.r + 0.587 * paper.g + 0.114 * paper.b;
      const grid = 16;
      const gw = Math.ceil(width / grid);
      const gh = Math.ceil(height / grid);
      const localMin = new Float32Array(gw * gh);
      const localMax = new Float32Array(gw * gh);
      for (let gy = 0; gy < gh; gy++) {
        for (let gx = 0; gx < gw; gx++) {
          let minL = 255, maxL = 0;
          const x0 = gx * grid, y0 = gy * grid;
          const x1 = Math.min(width, x0 + grid);
          const y1 = Math.min(height, y0 + grid);
          for (let y = y0; y < y1; y += 2) {
            for (let x = x0; x < x1; x += 2) {
              const i = (y * width + x) * 4;
              const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
              if (lum < minL) minL = lum;
              if (lum > maxL) maxL = lum;
            }
          }
          localMin[gy * gw + gx] = minL;
          localMax[gy * gw + gx] = maxL;
        }
      }
      const textCut = Math.min(paperLum - 45, 155);
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          let r = data[i], g = data[i + 1], b = data[i + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          const gx = Math.min(gw - 1, Math.floor(x / grid));
          const gy = Math.min(gh - 1, Math.floor(y / grid));
          const shadowFloor = localMin[gy * gw + gx];
          const localRange = localMax[gy * gw + gx] - shadowFloor;
          if (lum < textCut) {
            const darken = 0.15;
            d[i] = clamp(r * (1 - darken));
            d[i + 1] = clamp(g * (1 - darken));
            d[i + 2] = clamp(b * (1 - darken));
            d[i + 3] = data[i + 3];
            continue;
          }
          const shadowAmt = Math.max(0, (150 - shadowFloor) / 150);
          if (lum < paperLum - 5 && lum >= textCut) {
            const lift = ((paperLum - lum) / paperLum) * (0.5 + 0.4 * shadowAmt);
            r = r + (paper.r - r) * lift;
            g = g + (paper.g - g) * lift;
            b = b + (paper.b - b) * lift;
          }
          const edgeDist = Math.min(x, y, width - 1 - x, height - 1 - y);
          const edgeZone = Math.min(width, height) * 0.14;
          if (edgeDist < edgeZone && lum > textCut + 8) {
            const edgeFactor = 1 - edgeDist / edgeZone;
            const t = Math.min(0.92, edgeFactor * edgeFactor * 0.85 + edgeFactor * 0.25);
            r = r * (1 - t) + paper.r * t;
            g = g * (1 - t) + paper.g * t;
            b = b * (1 - t) + paper.b * t;
          }
          if (lum > 185) {
            const t = 0.35;
            r = r * (1 - t) + paper.r * t;
            g = g * (1 - t) + paper.g * t;
            b = b * (1 - t) + paper.b * t;
          }
          d[i] = clamp(r); d[i + 1] = clamp(g); d[i + 2] = clamp(b); d[i + 3] = data[i + 3];
        }
      }
      const border = Math.max(2, Math.floor(Math.min(width, height) * 0.012));
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const edgeDist = Math.min(x, y, width - 1 - x, height - 1 - y);
          if (edgeDist >= border) continue;
          const i = (y * width + x) * 4;
          const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          if (lum < textCut) continue;
          const t = 1 - edgeDist / border;
          d[i] = clamp(d[i] * (1 - t) + paper.r * t);
          d[i + 1] = clamp(d[i + 1] * (1 - t) + paper.g * t);
          d[i + 2] = clamp(d[i + 2] * (1 - t) + paper.b * t);
        }
      }
      state.baseImageData = out;
    }

    function magicDeblurCore() {
      const src = state.baseImageData;
      const { width: w, height: h, data } = src;
      const blur1 = blurRGB(data, w, h, 1);
      const blur2 = blurRGB(data, w, h, 2);
      const out = new ImageData(w, h);
      const d = out.data;
      for (let p = 0; p < w * h; p++) {
        const i = p * 4;
        const or_ = data[i], og = data[i + 1], ob = data[i + 2];
        const lum = 0.299 * or_ + 0.587 * og + 0.114 * ob;
        let a1 = 1.8, a2 = 0.9;
        if (lum > 220) { a1 = 0.4; a2 = 0.2; }
        else if (lum > 180) { a1 = 1.0; a2 = 0.5; }
        else if (lum < 30) { a1 = 1.2; a2 = 0.6; }
        else { a1 = 2.1; a2 = 1.1; }
        d[i] = clamp(or_ + a1 * (or_ - blur1[0][p]) + a2 * (or_ - blur2[0][p]));
        d[i + 1] = clamp(og + a1 * (og - blur1[1][p]) + a2 * (og - blur2[1][p]));
        d[i + 2] = clamp(ob + a1 * (ob - blur1[2][p]) + a2 * (ob - blur2[2][p]));
        d[i + 3] = 255;
      }
      state.baseImageData = out;
    }

    // ========== Open editor ==========
    function openEditor(opts) {
      showScreen("editor");
      setTool("move");
      applyModePreset();
      if (!state.filter) setFilter("original");
      else setFilter(state.filter);
      refreshPagesBar();
      // Show mode in header
      const titles = {
        document: "Document",
        receipt: "Receipt",
        card: "Business Card",
        whiteboard: "Whiteboard",
        photo: "Photo"
      };
      const h1 = document.querySelector("#editor .header h1");
      if (h1) h1.textContent = titles[state.scanMode] || "Edit";
      // Auto Magic for document-like modes (real scanner feel)
      if (opts && opts.autoMagic !== false && state.scanMode !== "photo") {
        setTimeout(() => runMagicEnhance(), 250);
      }
    }

    // Prevent pull-to-refresh / accidental zoom on iOS
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.body.addEventListener("touchmove", (e) => {
      if (e.target.closest(".tool-row, .filter-panel, .annotate-panel, .export-panel, #ocrPanel")) return;
    }, { passive: false });
  </script>
